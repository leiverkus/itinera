name: publish to PyPI

# Builds the pure-numpy/scipy `core/` as the `itinera` library and publishes it
# to PyPI via Trusted Publishing (OIDC — no API token). Triggered when a GitHub
# release is published. The version comes from metadata.txt (pyproject reads it).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Smoke-test the built wheel (clean env, no repo on sys.path)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp   # ensure the source `core/` is not importable here
          /tmp/smoke/bin/python - <<'PY'
          import numpy as np
          import itinera
          from itinera import build_conductance, least_cost_path, tobler, rowcol_to_node
          # public API present
          assert hasattr(itinera, "least_cost_path")
          assert hasattr(itinera, "build_conductance")
          # the GDAL module must NOT be in the wheel
          try:
              import itinera.raster_io  # noqa: F401
          except ModuleNotFoundError:
              pass
          else:
              raise SystemExit("raster_io leaked into the wheel")
          # end-to-end run
          dem = np.random.default_rng(0).random((30, 30)) * 100.0
          m, r, c = build_conductance(dem, 10.0, tobler, neighbours=8)
          path, cost = least_cost_path(m, rowcol_to_node(0, 0, c),
                                       rowcol_to_node(29, 29, c))
          assert path and cost > 0
          print("wheel smoke test OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
