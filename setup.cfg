[flake8]
# W503 and W504 are mutually exclusive (line break before vs. after a binary
# operator). PEP 8 recommends breaking *before* the operator, so we follow that
# and ignore both — "fixing" W503 would only trigger W504.
extend-ignore = W503, W504
# 88 (Black's default) rather than 79 — matches the codebase and avoids
# churn-only line wrapping; still flags genuinely overlong lines.
max-line-length = 88
exclude = .git,__pycache__,.venv,build,dist
